name: release

on:
  workflow_run:
    workflows: [tests]
    branches: [master]
    types: [completed]

jobs:

  release:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:

    - uses: actions/checkout@main
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Build and publish
      run: |
        uv build
        uv publish --token ${{ secrets.pypi }}
