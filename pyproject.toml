[project]
name = "muffin-apiclient"
version = "3.9.0"
description = "It's a plugin for Muffin framework which provides support for external APIs"
readme = "README.rst"
license = "MIT"
authors = [{ name = "Kirill Klenov", email = "horneds@gmail.com" }]
keywords = ["apiclient", "muffin", "asyncio", "trio", "curio"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Framework :: AsyncIO",
  "Framework :: Trio",
]
requires-python = ">=3.9"
dependencies = ["muffin", "aio-apiclient"]

[project.optional-dependencies]
aiohttp = ["aiohttp"]
httpx = ["httpx"]

[project.urls]
homepage = "https://github.com/klen/muffin-apiclient"
repository = "https://github.com/klen/muffin-apiclient"

[dependency-groups]
dev = [
  "ruff",
  "pytest",
  "pytest-mypy",
  "pytest-aio[curio,trio]",
  "aiohttp",
  "httpx",
  "pre-commit",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-xsv tests.py"
log_cli = true

[tool.mypy]
packages = ["muffin_apiclient"]
install_types = true
non_interactive = true
ignore_missing_imports = true

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py39,py310,py311,py312,py313,pypy39

[testenv]
deps = -e .[tests]
commands =
	pytest --mypy tests.py

[testenv:pypy39]
deps = -e .[tests]
commands =
	pytest tests.py
"""

[tool.ruff]
fix = true
line-length = 100
target-version = "py39"
exclude = [".venv", "docs", "examples"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",
  "UP",
  "ANN",
  "DJ",
  "EM",
  "RSE",
  "SLF",
  "RET",
  "S101",
  "PLR2004",
  "PLR0912",
  "N804",
  "A003",
  "TRY003",
  "CPY001",
]
