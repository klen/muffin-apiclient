[project]
name = "muffin-apiclient"
version = "3.9.0"
description = "It's a plugin for Muffin framework which provides support for external APIs"
readme = "README.rst"
license = "MIT"
authors = [{ name = "Kirill Klenov", email = "horneds@gmail.com" }]
keywords = ["apiclient", "muffin", "asyncio"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet :: WWW/HTTP",
  "Framework :: AsyncIO",
]
requires-python = ">=3.11,<4"
dependencies = ["muffin", "aio-apiclient"]

[project.optional-dependencies]
aiohttp = ["aiohttp"]
httpx = ["httpx"]

[project.urls]
homepage = "https://github.com/klen/muffin-apiclient"
repository = "https://github.com/klen/muffin-apiclient"

[dependency-groups]
dev = [
  "ruff",
  "pytest",
  "pytest-aio",
  "aiohttp",
  "httpx",
  "pre-commit",
  "pyrefly",
  "tox",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "muffin_apiclient"
module-root = ""

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-xsv tests.py"
log_cli = true

[tool.pyrefly]
project-includes = ["muffin_apiclient"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py311,py312,py313,py314,py315,pypy311

[testenv]
allowlist_externals = uv,pytest
commands =
  uv pip install --system -e . --group dev
	pytest tests.py
"""

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "docs", "examples"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A003",
  "ANN",
  "ARG",
  "COM",
  "CPY001",
  "D",
  "DJ",
  "EM",
  "FA100",
  "FIX",
  "N",
  "PLC0415",
  "PLR0912",
  "PLR2004",
  "RET",
  "RSE",
  "RUF012",
  "S101",
  "SLF",
  "TD",
  "TRY003",
  "UP",
]

[tool.bumpversion]
current_version = "3.9.0"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
